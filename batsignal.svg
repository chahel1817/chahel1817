<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="1400" height="500">
  <title>Bat Signal - Chahel Tanna</title>

  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#141830" />
      <stop offset="55%" stop-color="#0a0c1a" />
      <stop offset="100%" stop-color="#05060d" />
    </radialGradient>

    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f5c518" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#f5c518" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f5c518" stop-opacity="0" />
    </linearGradient>

    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="500" fill="url(#skyGlow)" />

  <circle cx="700" cy="170" r="230" fill="none" stroke="#f5c518" stroke-opacity="0.18" stroke-width="1.4" />
  <circle cx="700" cy="170" r="150" fill="none" stroke="#f5c518" stroke-opacity="0.10" stroke-width="1" />

  <circle cx="150" cy="80" r="2" fill="#e8edf5" opacity="0.5" />
  <circle cx="1260" cy="110" r="2" fill="#e8edf5" opacity="0.4" />
  <circle cx="330" cy="230" r="1.6" fill="#e8edf5" opacity="0.35" />
  <circle cx="1080" cy="60" r="1.6" fill="#e8edf5" opacity="0.45" />
  <circle cx="950" cy="220" r="1.6" fill="#e8edf5" opacity="0.3" />

  <polygon points="628,140 772,140 900,470 500,470" fill="url(#beamGrad)" />

  <!-- Dark Knight bat emblem — single continuous silhouette -->
  <g transform="translate(610,88) scale(0.9)" filter="url(#goldGlow)">
    <path
      d="M195 42 Q160 18 125 20 Q116 10 108 3 Q102 8 100 16 Q98 8 92 3 Q84 10 75 20 Q40 18 5 42 Q30 65 55 60 Q75 75 100 80 Q125 75 145 60 Q170 65 195 42 Z"
      fill="#05060d"
      stroke="#f5c518"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
  </g>

  <text
    x="700"
    y="360"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="72"
    font-weight="900"
    fill="#f5c518"
    letter-spacing="4"
    filter="url(#softGlow)"
  >CHAHEL TANNA</text>

  <text
    x="700"
    y="410"
    text-anchor="middle"
    font-family="Courier New, monospace"
    font-size="26"
    fill="#c7cfdb"
    letter-spacing="10"
  >FULL STACK VIGILANTE</text>
</svg>
