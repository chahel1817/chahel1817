<svg
  width="1200"
  height="180"
  viewBox="0 0 1200 180"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">

      <stop offset="0%" stop-color="#050b16"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#050b16"/>

    </linearGradient>


    <linearGradient id="circuit">

      <stop offset="0%" stop-color="#2563eb" stop-opacity=".05"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity=".05"/>

    </linearGradient>


    <filter id="glow">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <filter id="bigGlow">

      <feGaussianBlur
        stdDeviation="8"
      />

    </filter>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect
    width="1200"
    height="180"
    fill="url(#bg)"
  />


  <!-- ================= CIRCUIT NETWORK ================= -->

  <g
    fill="none"
    stroke="url(#circuit)"
    stroke-width="1.2"
  >

    <!-- LEFT -->

    <path d="M-20 100 L120 100 L190 55 L300 55"/>

    <path d="M40 35 L120 35 L175 75 L250 75"/>

    <path d="M80 150 L170 150 L230 105 L300 105"/>


    <!-- CENTER -->

    <path d="M300 55 L400 55 L470 90 L570 90"/>

    <path d="M250 75 L350 75 L420 120 L520 120"/>

    <path d="M300 105 L400 105 L470 45 L570 45"/>


    <!-- RIGHT -->

    <path d="M570 90 L650 90 L720 45 L830 45"/>

    <path d="M520 120 L650 120 L710 145 L820 145"/>

    <path d="M570 45 L650 45 L730 85 L900 85"/>


    <!-- FAR RIGHT -->

    <path d="M830 45 L930 45 L1000 80 L1220 80"/>

    <path d="M820 145 L930 145 L1010 110 L1220 110"/>

    <path d="M900 85 L970 85 L1040 35 L1220 35"/>

  </g>


  <!-- ================= CIRCUIT NODES ================= -->

  <g fill="#38bdf8">

    <circle cx="120" cy="100" r="2"/>

    <circle cx="190" cy="55" r="2"/>

    <circle cx="250" cy="75" r="2"/>

    <circle cx="300" cy="55" r="2.5"/>

    <circle cx="300" cy="105" r="2"/>

    <circle cx="400" cy="55" r="2"/>

    <circle cx="420" cy="120" r="2"/>

    <circle cx="470" cy="90" r="3"/>

    <circle cx="470" cy="45" r="2"/>

    <circle cx="520" cy="120" r="2"/>

    <circle cx="570" cy="90" r="3"/>

    <circle cx="570" cy="45" r="2"/>

    <circle cx="650" cy="90" r="2"/>

    <circle cx="650" cy="120" r="2"/>

    <circle cx="650" cy="45" r="2"/>

    <circle cx="720" cy="45" r="2"/>

    <circle cx="710" cy="145" r="2"/>

    <circle cx="730" cy="85" r="2"/>

    <circle cx="830" cy="45" r="2.5"/>

    <circle cx="820" cy="145" r="2"/>

    <circle cx="900" cy="85" r="3"/>

    <circle cx="930" cy="45" r="2"/>

    <circle cx="930" cy="145" r="2"/>

    <circle cx="970" cy="85" r="2"/>

    <circle cx="1040" cy="35" r="2"/>

  </g>


  <!-- ================= NODE PULSES ================= -->

  <g fill="#67e8f9">

    <circle cx="300" cy="55" r="3">

      <animate
        attributeName="r"
        values="2;6;2"
        dur="3s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values=".3;1;.3"
        dur="3s"
        repeatCount="indefinite"
      />

    </circle>


    <circle cx="570" cy="90" r="3">

      <animate
        attributeName="r"
        values="2;7;2"
        dur="4s"
        begin="1s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="4s"
        begin="1s"
        repeatCount="indefinite"
      />

    </circle>


    <circle cx="900" cy="85" r="3">

      <animate
        attributeName="r"
        values="2;6;2"
        dur="3.5s"
        begin="2s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="3.5s"
        begin="2s"
        repeatCount="indefinite"
      />

    </circle>

  </g>


  <!-- ================= TRAVELING SIGNALS ================= -->


  <circle
    r="3"
    fill="#67e8f9"
    filter="url(#glow)"
  >

    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M-20 100
            L120 100
            L190 55
            L300 55
            L400 55
            L470 90
            L570 90
            L650 90
            L720 45
            L830 45
            L930 45
            L1000 80
            L1220 80"
    />

  </circle>


  <circle
    r="2.5"
    fill="#38bdf8"
    filter="url(#glow)"
  >

    <animateMotion
      dur="6.5s"
      begin="2s"
      repeatCount="indefinite"
      path="M40 35
            L120 35
            L175 75
            L250 75
            L350 75
            L420 120
            L520 120
            L650 120
            L710 145
            L820 145
            L930 145
            L1010 110
            L1220 110"
    />

  </circle>


  <circle
    r="2"
    fill="#93c5fd"
  >

    <animateMotion
      dur="7s"
      begin="3.5s"
      repeatCount="indefinite"
      path="M80 150
            L170 150
            L230 105
            L300 105
            L400 105
            L470 45
            L570 45
            L650 45
            L730 85
            L900 85
            L970 85
            L1040 35
            L1220 35"
    />

  </circle>


  <!-- ================= VERY SUBTLE GLOW ================= -->

  <circle
    cx="570"
    cy="90"
    r="22"
    fill="#2563eb"
    opacity=".04"
    filter="url(#bigGlow)"
  >

    <animate
      attributeName="r"
      values="18;35;18"
      dur="4s"
      repeatCount="indefinite"
    />

  </circle>

</svg>
